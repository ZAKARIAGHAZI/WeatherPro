<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherPro</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo">
          <i class="fas fa-cloud-sun"></i>
          WeatherPro
        </div>
        <div class="search-container">
          <input
            type="text"
            class="search-input"
            placeholder="Search for a city..."
            id="cityInput"
          />
          <button type="button" class="search-btn" id="searchBtn">
            <i class="fas fa-search"></i>
          </button>
        </div>
        <div class="header-buttons">
          <button id="unitToggle" class="unit-toggle">°F</button>
          <div class="toggle-theme" id="themeToggle">🌓</div>
        </div>
      </header>

      <div class="card" id="weatherCard">
        <h3 id="location">Loading...</h3>
        <div class="weather-icon" id="weatherIcon">☁️</div>
        <h1 id="temperature"></h1>
        <p id="description"></p>
        <div class="details">
          <div><strong id="feelsLike"></strong><br />Feels like</div>
          <div><strong id="humidity"></strong><br />Humidity</div>
          <div><strong id="wind"></strong><br />Wind</div>
          <div><strong id="pressure"></strong><br />Pressure</div>
        </div>
      </div>

      <div class="hourly-section">
        <div class="section-title">
          <i class="fas fa-clock"></i>
          3-Hour Forecast
        </div>
        <div class="hourly-scroll" id="hourlyForecast">
          <div class="loading-container">
            <div class="loading"></div>
            <span>Chargement des prévisions horaires...</span>
          </div>
        </div>
      </div>

      <!-- 7-Day Forecast -->
      <div class="section forecast-card">
        <div class="section-title">
          <i class="fas fa-calendar-alt"></i>
          Prévisions sur 7 jours
        </div>
        <div id="dailyForecastList" class="forecast-list">
          <!-- Forecast rows will be injected here -->
        </div>
      </div>
    </div>

    <!-- Footer-->

    <footer class="footer">
      <div class="container">
        <p>© 2025 WeatherPro. All rights reserved.</p>
        <p>
          Made with 
            <i class="fas fa-cloud-sun"></i>
          WeatherPro by
          <a href="#" target="_blank" rel="noopener">HitRadio</a>
        </p>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
